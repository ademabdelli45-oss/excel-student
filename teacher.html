<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Excel Teacher QR</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><style>@media print{body{background:#fff!important;color:#000}.bgfx,.noprint,#toast{display:none!important}#app{max-width:none;padding:0}.pcard{break-inside:avoid;border:1px solid #999!important;background:#fff!important;color:#000!important;box-shadow:none!important;backdrop-filter:none!important}.pcard *{color:#000!important}}.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}#app{max-width:980px}.qrw{background:#fff;border-radius:26px;padding:18px;display:inline-block;box-shadow:0 20px 60px rgba(139,92,246,.4)}.tabs{display:flex;gap:8px;margin:12px 0;overflow:auto}.big{font-family:var(--disp);font-size:44px}@media(min-width:760px){.two{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}}</style></head><body>
<div class="bgfx"><i></i><i></i><i></i><div class="fx"></div></div><div id="toast" class="toast"></div><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
var SB=supabase.createClient('https://skmdfluinkkdgyzgvuph.supabase.co','sb_publishable_v4wMwbVmjPfxnf8U6VyGgA_fnOs0WMG');
var $=function(s){return document.querySelector(s)};var E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var PIN='',ST=null,SID=null,timers=[];
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2800)}
async function rpc(fn,a){var r=await SB.rpc(fn,a||{});if(r.error)throw new Error(r.error.message);return r.data}
function clr(){timers.forEach(clearInterval);timers=[]}
function login(){clr();$('#app').innerHTML='<div class="view" style="max-width:380px;margin:12vh auto;text-align:center"><img src="logo_white.png" width="240" style="max-width:70vw"><h1 style="margin:14px 0 4px">Teacher QR</h1><p class="mut">Excel Language Center</p><div class="card" style="text-align:left"><span class="lbl" style="margin-top:0">Teacher PIN</span><input id="pin" type="password" inputmode="numeric" class="inp" placeholder="••••"><button id="go" class="btn" style="width:100%;margin-top:14px">Sign in</button></div></div>';
 var f=async function(){try{PIN=$('#pin').value.trim();ST=await rpc('staff_login',{p_pin:PIN});try{sessionStorage.setItem('xp',PIN)}catch(e){}home()}catch(e){toast(e.message)}};$('#go').onclick=f;$('#pin').onkeydown=function(e){if(e.key==='Enter')f()}}
function home(){clr();$('#app').innerHTML='<div class="view"><div class="row" style="margin:12px 0"><h1 class="grow">Hi '+E(ST.name)+' 👋</h1><button class="btn sm ghost" id="so">Sign out</button></div><div class="tabs" id="tb"></div><div id="bd"></div></div>';
 $('#so').onclick=function(){PIN='';try{sessionStorage.removeItem('xp')}catch(e){}login()};
 var T=[['qr','📷 Class QR'],['st','🎓 Students'],['ab','✉️ Absences'],['hw','📚 Homework'],['ib','💬 Inbox'],['ev','🗓️ Events']];$('#tb').innerHTML=T.map(function(t){return '<button class="btn sm ghost" data-t="'+t[0]+'" style="white-space:nowrap">'+t[1]+'</button>'}).join('');
 document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){clr();({qr:qrTab,st:stuTab,ab:absTab,hw:hwTab,ib:inboxTab,ev:evTab})[b.dataset.t]()}});qrTab()}
function qrTab(){var cs=ST.classes||[];$('#bd').innerHTML='<div class="card"><span class="lbl" style="margin-top:0">Class</span><select id="cl" class="inp">'+cs.map(function(c){return '<option value="'+E(c.id)+'">'+E(c.name)+'</option>'}).join('')+'</select><span class="lbl">Late after (minutes)</span><input id="lt" type="number" class="inp" value="10" min="1" max="60"><button id="op" class="btn" style="width:100%;margin-top:14px">Open class &amp; show QR</button></div>';
 $('#op').onclick=async function(){try{SID=await rpc('staff_open',{p_pin:PIN,p_class:$('#cl').value,p_late:+$('#lt').value||10});live()}catch(e){toast(e.message)}}}
function live(){clr();$('#bd').innerHTML='<div class="two"><div style="text-align:center"><div class="qrw" id="qr"></div><div class="mut" style="margin-top:10px">Refreshes every 30s · students scan inside the Excel app</div><div class="big" id="cd">30</div><div class="row" style="justify-content:center"><button class="btn sm ghost" id="fs">Fullscreen</button><button class="btn sm red" id="cx">Close class</button></div></div><div><div class="row"><h2 class="grow">Live attendance</h2><span class="chip" id="cnt"></span></div><div id="lv" style="margin-top:10px"></div></div></div>';
 $('#cx').onclick=async function(){try{await rpc('staff_close',{p_pin:PIN,p_sid:SID});toast('Class closed');clr();qrTab()}catch(e){toast(e.message)}};$('#fs').onclick=function(){var e=$('#qr');(e.requestFullscreen||function(){}).call(e)};
 var lastTok='',left=0;async function q(){try{var r=await rpc('staff_qr',{p_pin:PIN,p_sid:SID});left=r.left;if(r.token!==lastTok){lastTok=r.token;var qq=qrcode(0,'M');qq.addData(r.token);qq.make();$('#qr').innerHTML=qq.createSvgTag({cellSize:7,margin:0,scalable:true});$('#qr svg').style.width='min(78vw,360px)';$('#qr svg').style.height='auto'}}catch(e){}}
 async function lv(){try{var r=await rpc('staff_live',{p_pin:PIN,p_sid:SID});var p=r.filter(function(x){return x.status==='present'}).length,l=r.filter(function(x){return x.status==='late'}).length;$('#cnt').textContent=p+' on time · '+l+' late · '+(r.length-p-l)+' waiting';
 $('#lv').innerHTML=r.map(function(s){var c=s.status==='present'?'g':s.status==='late'?'a':s.status==='absent'?'r':'';return '<div class="card row" style="margin:6px 0;padding:10px"><div class="grow"><b>'+E(s.name)+'</b><div class="mut sm">'+E(s.id)+(s.absent_ok?' · excused':'')+(s.joined?'':' · not activated')+'</div></div><span class="chip '+c+'">'+E(s.status)+'</span><select data-m="'+E(s.id)+'" class="inp" style="width:auto;padding:6px"><option value="">mark…</option><option>present</option><option>late</option><option>absent</option></select></div>'}).join('');
 document.querySelectorAll('[data-m]').forEach(function(s){s.onchange=async function(){if(!s.value)return;try{await rpc('staff_mark',{p_pin:PIN,p_sid:SID,p_student:s.dataset.m,p_status:s.value});lv()}catch(e){toast(e.message)}}})}catch(e){}}
 q();lv();timers.push(setInterval(function(){left=Math.max(0,left-1);$('#cd').textContent=left;if(left<=1)setTimeout(q,1100)},1000));timers.push(setInterval(q,8000));timers.push(setInterval(lv,4000))}
async function absTab(){$('#bd').innerHTML='Loading…';var r=await rpc('staff_absences',{p_pin:PIN});$('#bd').innerHTML=(r||[]).map(function(a){return '<div class="card" style="margin:8px 0"><div class="row"><div class="grow"><b>'+E(a.student||a.name||a.student_id)+'</b> · '+E(a.on_date)+'<div class="mut sm">'+E(a.reason)+'</div></div><span class="chip '+(a.status==='approved'?'g':a.status==='declined'?'r':'a')+'">'+E(a.status)+'</span></div>'+(a.status==='pending'?'<div class="row" style="margin-top:8px"><button class="btn sm" data-y="'+a.id+'">Approve</button><button class="btn sm red" data-n="'+a.id+'">Decline</button></div>':'')+'</div>'}).join('')||'<div class="card">No requests.</div>';
 document.querySelectorAll('[data-y],[data-n]').forEach(function(b){b.onclick=async function(){await rpc('staff_decide',{p_pin:PIN,p_id:+(b.dataset.y||b.dataset.n),p_status:b.dataset.y?'approved':'declined'});absTab()}})}
async function hwTab(){var cs=ST.classes||[];$('#bd').innerHTML='<div class="card"><select id="hc" class="inp"><option value="all">All classes</option>'+cs.map(function(c){return '<option value="'+E(c.id)+'">'+E(c.name)+'</option>'}).join('')+'</select><input id="ht" class="inp" placeholder="Title" style="margin-top:8px"><textarea id="hb" class="inp" rows="3" placeholder="Instructions" style="margin-top:8px"></textarea><input id="hd" type="date" class="inp" style="margin-top:8px"><input id="hf" type="file" class="inp" style="margin-top:8px"><button id="ha" class="btn" style="width:100%;margin-top:10px">Post homework</button></div><div id="hl" style="margin-top:12px"></div>';
 async function ls(){var r=await rpc('staff_hw_list',{p_pin:PIN});$('#hl').innerHTML=(r||[]).map(function(h){return '<div class="card row" style="margin:6px 0"><div class="grow"><b>'+E(h.title)+'</b><div class="mut sm">'+E(h.class_id)+' · due '+E(h.due||'-')+(h.done!=null?' · '+h.done+' done':'')+'</div></div><button class="btn sm red" data-d="'+h.id+'">Delete</button></div>'}).join('');document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=async function(){await rpc('staff_hw_del',{p_pin:PIN,p_id:+b.dataset.d});ls()}})}
 ls();$('#ha').onclick=async function(){try{var url=null,f=$('#hf').files[0];if(f){var p='hw/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9.]/g,'_');var u=await SB.storage.from('homework').upload(p,f);if(u.error)throw u.error;url=SB.storage.from('homework').getPublicUrl(p).data.publicUrl}
 await rpc('staff_hw_add',{p_pin:PIN,p_class:$('#hc').value,p_title:$('#ht').value,p_body:$('#hb').value,p_due:$('#hd').value||null,p_file:url});toast('Posted ✅');hwTab()}catch(e){toast(e.message)}}}
async function inboxTab(){var r=await rpc('staff_inbox',{p_pin:PIN});$('#bd').innerHTML=(r||[]).map(function(x){return '<div class="card" style="margin:8px 0"><div class="row"><b class="grow">'+E(x.student)+' · '+E(x.kind)+'</b><span class="chip '+(x.status==='new'?'a':'g')+'">'+E(x.status)+'</span></div><p style="margin:6px 0">'+E(x.body)+'</p>'+(x.status==='new'?'<button class="btn sm" data-s="'+x.src+'" data-i="'+x.id+'">Mark handled</button>':'')+'</div>'}).join('')||'<div class="card">Inbox empty.</div>';document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=async function(){await rpc('staff_inbox_set',{p_pin:PIN,p_src:b.dataset.s,p_id:+b.dataset.i,p_status:'done'});inboxTab()}})}
function evTab(){var cs=ST.classes||[];$('#bd').innerHTML='<div class="card"><select id="ec" class="inp"><option value="all">All classes</option>'+cs.map(function(c){return '<option value="'+E(c.id)+'">'+E(c.name)+'</option>'}).join('')+'</select><input id="et" class="inp" placeholder="Event title" style="margin-top:8px"><input id="ed" type="date" class="inp" style="margin-top:8px"><select id="ek" class="inp" style="margin-top:8px"><option>event</option><option>exam</option><option>holiday</option></select><button id="ea" class="btn" style="width:100%;margin-top:10px">Add to calendar</button></div>';$('#ea').onclick=async function(){try{await rpc('staff_event_add',{p_pin:PIN,p_class:$('#ec').value,p_title:$('#et').value,p_date:$('#ed').value,p_kind:$('#ek').value});toast('Added 🗓️');$('#et').value=''}catch(e){toast(e.message)}}}

var STU=[],SLINK='https://ademabdelli45-oss.github.io/excel-student/';
function plink(s){return SLINK+'?c='+encodeURIComponent(s.id)+'.'+s.code}
async function stuTab(){$('#bd').innerHTML='<div class="mut">Loading students…</div>';try{STU=await rpc('staff_roster',{p_pin:PIN})}catch(e){$('#bd').innerHTML='<div class="card">'+E(e.message)+'</div>';return}
 var cl={};STU.forEach(function(s){if(s.class)cl[s.class]=1});
 $('#bd').innerHTML='<div class="card noprint"><div class="row"><input id="sq" class="inp" placeholder="Search name or ID"><select id="sc" class="inp" style="width:auto;max-width:46%"><option value="">All classes</option>'+Object.keys(cl).sort().map(function(c){return '<option>'+E(c)+'</option>'}).join('')+'</select></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><span class="chip" id="scnt"></span><button class="btn sm ghost" id="spr">🖨️ Print cards</button><button class="btn sm ghost" id="scv">⬇️ Download CSV</button><button class="btn sm ghost" id="scpy">📋 Copy all links</button></div></div><div id="sl" style="margin-top:12px"></div>';
 var draw=function(){var q=$('#sq').value.toLowerCase(),c=$('#sc').value;var L=STU.filter(function(s){return (!q||(s.name+' '+s.id).toLowerCase().indexOf(q)>-1)&&(!c||s.class===c)});
  $('#scnt').textContent=L.length+' students · '+L.filter(function(s){return s.claimed}).length+' activated';
  $('#sl').innerHTML=L.map(function(s,i){return '<div class="card" style="margin:8px 0;padding:12px"><div class="row"><div class="grow"><b>'+E(s.name)+'</b><div class="mut sm">'+E(s.id)+' · '+E(s.class||'No class')+'</div></div><span class="chip '+(s.claimed?'g':'a')+'">'+(s.claimed?'activated':'waiting')+'</span></div><div class="row noprint" style="margin-top:8px;flex-wrap:wrap"><span class="chip">code '+E(s.code)+'</span><button class="btn sm" data-cp="'+i+'">Copy link</button><button class="btn sm ghost" data-wa="'+i+'">WhatsApp</button></div></div>'}).join('');
  var sh=function(a){return a};$$('[data-cp]').forEach(function(b){b.onclick=function(){var s=L[+b.dataset.cp];try{navigator.clipboard.writeText(plink(s)).then(function(){toast('Link copied for '+s.name)})}catch(e){toast(plink(s))}}});
  $$('[data-wa]').forEach(function(b){b.onclick=function(){var s=L[+b.dataset.wa];window.open('https://wa.me/?text='+encodeURIComponent('Hi '+s.name.split(' ')[0]+'! Your Excel Student account is ready. Tap to activate: '+plink(s)+'  (ID '+s.id+', code '+s.code+')'),'_blank')}});
  draw.L=L};
 $('#sq').oninput=draw;$('#sc').onchange=draw;draw();
 $('#scpy').onclick=function(){var t=draw.L.map(function(s){return s.name+'\t'+s.id+'\t'+s.code+'\t'+plink(s)}).join('\n');try{navigator.clipboard.writeText(t).then(function(){toast('Copied '+draw.L.length+' rows — paste into Sheets')})}catch(e){toast('Copy not allowed')}};
 $('#scv').onclick=function(){var t='Name,Student ID,Class,Code,Activation link,Activated\n'+draw.L.map(function(s){return [s.name,s.id,s.class||'',s.code,plink(s),s.claimed?'yes':'no'].map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='excel-student-links.csv';a.click()};
 $('#spr').onclick=function(){var L=draw.L;$('#sl').className='pcards';$('#sl').innerHTML=L.map(function(s){var q=qrcode(0,'M');q.addData(plink(s));q.make();return '<div class="card pcard" style="padding:14px;text-align:center"><img src="logo_navy.png" style="width:150px;display:block;margin:0 auto 8px"><b style="font-size:16px">'+E(s.name)+'</b><div class="mut sm">'+E(s.class||'')+'</div><div style="width:130px;margin:8px auto">'+q.createSvgTag({cellSize:4,margin:0,scalable:true})+'</div><div class="sm">Scan to activate your Excel Student account</div><div class="sm"><b>ID '+E(s.id)+'</b> · code <b>'+E(s.code)+'</b></div></div>'}).join('');setTimeout(function(){window.print()},400)}}
(async function(){try{var p=sessionStorage.getItem('xp');if(p){PIN=p;ST=await rpc('staff_login',{p_pin:PIN});return home()}}catch(e){}login()})();
</script></body></html>
